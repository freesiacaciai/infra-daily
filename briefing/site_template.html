<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1b1b1b;--sub:#6b6b6b;--line:#e3e1da;--accent:#2f5d8a;--dark:#1b1b1b;--mark:#ffe27a}
  @media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1d1d1d;--ink:#ececec;--sub:#9a9a9a;--line:#2e2e2e;--accent:#7fb0e0;--dark:#000;--mark:#7a6400}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .bar{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center}
  .brand{font-weight:800;font-size:18px;white-space:nowrap;cursor:pointer}
  .brand small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
  #q{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px;display:grid;grid-template-columns:220px 1fr;gap:28px}
  nav{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;font-size:13px}
  nav h4{margin:14px 0 4px;font-size:12px;color:var(--sub);font-weight:600}
  nav a{display:block;padding:4px 8px;border-radius:6px;color:var(--ink)}
  nav a.on{background:var(--dark);color:#fff}
  nav a span{color:var(--sub);margin-left:4px} nav a.on span{color:#bbb}
  #navsel{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px}
  main{min-width:0}
  .date{font-size:13px;color:var(--sub)}
  h1{margin:2px 0 16px;font-size:24px}
  .pager{display:flex;gap:8px;margin-bottom:16px}
  .pager button,.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
  .pager button:disabled{opacity:.35;cursor:default}
  .top3{background:var(--dark);color:#fff;border-radius:10px;padding:16px 20px;margin-bottom:20px}
  .top3 .lb{font-size:12px;color:#aaa} .top3 ol{margin:6px 0 0;padding-left:20px} .top3 li{margin:4px 0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 20px;margin:12px 0}
  section.card h2{font-size:16px;margin:2px 0 6px}
  section.card ul{margin:0;padding-left:18px} section.card li{margin:8px 0}
  .refs{font-size:12px;color:var(--sub)}
  .watch{background:transparent;border-style:dashed}
  .warn{background:#fff4e5;color:#7a4b00;border-left:3px solid #f0a020;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:14px}
  .res{padding:12px 0;border-bottom:1px solid var(--line)}
  .res .meta{font-size:12px;color:var(--sub)} mark{background:var(--mark);color:inherit;padding:0 1px}
  .empty{color:var(--sub);padding:40px 0;text-align:center}
  footer{max-width:1080px;margin:0 auto;padding:30px 20px 50px;font-size:12px;color:var(--sub)}
  @media (max-width:760px){.wrap{grid-template-columns:1fr} nav{display:none} #navsel{display:block} .brand small{display:none}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand" id="home">{{TITLE}}<small>{{TAGLINE}}</small></div>
  <input id="q" type="search" placeholder="전체 기간 검색 (예: 변압기)" autocomplete="off">
</div></header>
<div class="wrap">
  <nav id="nav"></nav>
  <main><select id="navsel"></select><div id="view"><div class="empty">불러오는 중…</div></div></main>
</div>
<footer>뉴스 제목을 바탕으로 AI가 자동 생성한 요약입니다. 사실관계와 세부 내용은 각 항목의 원문 링크에서 확인하세요. 투자 조언이 아닙니다.</footer>

<script>
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const WD = "일월화수목금토";
const fmt = d => { const t = new Date(d + "T00:00:00"); return `${d.replaceAll("-", ".")} (${WD[t.getDay()]})`; };

let DAYS = [], SEARCH = null, topicFilter = null;

async function j(url) { const r = await fetch(url, {cache: "no-cache"}); if (!r.ok) throw new Error(url); return r.json(); }

function buildNav(cur) {
  const nav = $("#nav"); nav.replaceChildren();
  const sel = $("#navsel"); sel.replaceChildren();
  let month = "";
  for (const d of DAYS) {
    const m = d.d.slice(0, 7);
    if (m !== month) { month = m; nav.append(el("h4", {}, `${m.slice(0,4)}년 ${+m.slice(5)}월`)); }
    nav.append(el("a", {href: `#/${d.d}`, class: d.d === cur ? "on" : ""}, `${+d.d.slice(8)}일`, el("span", {}, WD[new Date(d.d + "T00:00:00").getDay()])));
    const o = el("option", {value: d.d}, fmt(d.d)); if (d.d === cur) o.selected = true; sel.append(o);
  }
  sel.onchange = () => location.hash = `#/${sel.value}`;
}

async function showDay(date) {
  const view = $("#view");
  if (!DAYS.length) { view.replaceChildren(el("div", {class: "empty"}, "아직 기록이 없습니다.")); return; }
  if (!date || !DAYS.find(d => d.d === date)) date = DAYS[0].d;
  buildNav(date);
  const day = await j(`data/d/${date}.json`);
  const i = DAYS.findIndex(d => d.d === date);
  const refs = ids => {
    const links = (ids || []).map(id => day.refs[id]).filter(Boolean).map(r => el("a", {href: r.u, target: "_blank", rel: "noopener"}, r.s));
    if (!links.length) return null;
    const span = el("span", {class: "refs"}, " — ");
    links.forEach((a, k) => { if (k) span.append(" · "); span.append(a); });
    return span;
  };
  const topics = (day.sections || []).map(s => s.topic);
  if (topicFilter && !topics.includes(topicFilter)) topicFilter = null;

  const body = [];
  body.push(el("div", {class: "date"}, fmt(date)), el("h1", {}, "데일리 브리핑"));
  body.push(el("div", {class: "pager"},
    el("button", {disabled: i >= DAYS.length - 1 ? "" : null, onclick: () => location.hash = `#/${DAYS[i+1].d}`}, "← 이전 날"),
    el("button", {disabled: i <= 0 ? "" : null, onclick: () => location.hash = `#/${DAYS[i-1].d}`}, "다음 날 →")));
  if (day.fallback) body.push(el("div", {class: "warn"}, day.fallback));
  if (day.top3 && day.top3.length) body.push(el("div", {class: "top3"}, el("div", {class: "lb"}, "오늘의 3줄"), el("ol", {}, day.top3.map(t => el("li", {}, t)))));
  if (topics.length > 1) {
    body.push(el("div", {class: "chips"},
      el("button", {class: "chip" + (topicFilter ? "" : " on"), onclick: () => { topicFilter = null; showDay(date); }}, "전체"),
      topics.map(t => el("button", {class: "chip" + (topicFilter === t ? " on" : ""), onclick: () => { topicFilter = t; showDay(date); }}, t))));
  }
  for (const s of day.sections || []) {
    if (topicFilter && s.topic !== topicFilter) continue;
    body.push(el("section", {class: "card"}, el("h2", {}, s.topic), el("ul", {}, s.points.map(p => el("li", {}, p.text, refs(p.refs))))));
  }
  if (!topicFilter && day.watch && day.watch.length)
    body.push(el("section", {class: "card watch"}, el("h2", {}, "지켜볼 것"), el("ul", {}, day.watch.map(t => el("li", {}, t)))));
  view.replaceChildren(...body);
  window.scrollTo(0, 0);
}

function highlight(text, terms) {
  if (!terms.length) return [text];
  const re = new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return text.split(re).map((part, k) => k % 2 ? el("mark", {}, part) : part);
}

async function doSearch(q) {
  const view = $("#view");
  const terms = q.trim().split(/\s+/).filter(Boolean);
  if (!terms.length) { route(); return; }
  if (!SEARCH) SEARCH = await j("data/search.json");
  const low = terms.map(t => t.toLowerCase());
  const hits = SEARCH.filter(r => { const x = (r.x + " " + r.k).toLowerCase(); return low.every(t => x.includes(t)); });
  buildNav(null);
  const out = [el("div", {class: "date"}, "검색"), el("h1", {}, `"${q.trim()}" — ${hits.length}건`)];
  if (!hits.length) out.push(el("div", {class: "empty"}, "결과가 없습니다. 다른 단어로 찾아보세요."));
  for (const h of hits.slice(0, 300))
    out.push(el("div", {class: "res"},
      el("div", {class: "meta"}, el("a", {href: `#/${h.d}`, onclick: () => { $("#q").value = ""; }}, fmt(h.d)), ` · ${h.k}`),
      el("div", {}, highlight(h.x, terms))));
  view.replaceChildren(...out);
}

function route() { const m = location.hash.match(/^#\/(\d{4}-\d{2}-\d{2})/); showDay(m ? m[1] : null); }

let timer;
$("#q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => doSearch(e.target.value), 200); });
$("#home").onclick = () => { $("#q").value = ""; location.hash = ""; route(); };
window.addEventListener("hashchange", () => { $("#q").value = ""; route(); });

j("data/days.json").then(d => { DAYS = d; route(); }).catch(() => $("#view").replaceChildren(el("div", {class: "empty"}, "데이터를 불러오지 못했습니다.")));
</script>
</body>
</html>
