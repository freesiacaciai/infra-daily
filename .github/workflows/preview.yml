name: preview-themes
on:
  push:
    branches: [preview-themes]
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          python -m briefing.main --config preview.yaml --dry-run
          python -c "import json,glob;print(json.dumps(json.load(open(sorted(glob.glob('archive/*.json'))[-1])),ensure_ascii=False,indent=1))"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
