name: daily-briefing

on:
  schedule:
    - cron: "20 22 * * *"   # UTC 22:20 = KST 07:20 시작 → GitHub 지연 감안 7시 반 전후 도착
  workflow_dispatch:
    inputs:
      send_email:
        description: "메일 발송"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 수집·요약·기록·사이트 생성·메일 발송
        run: python -m briefing.main ${{ github.event_name == 'workflow_dispatch' && !inputs.send_email && '--no-email' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: 기록 커밋
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "archive: $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
